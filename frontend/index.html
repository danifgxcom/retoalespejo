<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="%GAME_TAGLINE%" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://desafiaalreflejo.danifgx.org/" />
    <meta property="og:site_name" content="%GAME_NAME%" />
    <meta property="og:title" content="%GAME_NAME%" />
    <meta property="og:description" content="%GAME_TAGLINE%" />
    <!-- Las tarjetas sociales NO renderizan SVG: X, Facebook y WhatsApp lo ignoran y el
         enlace sale sin imagen. Por eso og:image es un PNG 1200x630 y el favicon sigue
         siendo SVG, que para el icono de pestaña sí es lo correcto. -->
    <meta property="og:image" content="https://desafiaalreflejo.danifgx.org/brand-card.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Una pieza del juego y su reflejo a cada lado de la linea del espejo" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="%GAME_NAME%" />
    <meta name="twitter:description" content="%GAME_TAGLINE%" />
    <meta name="twitter:image" content="https://desafiaalreflejo.danifgx.org/brand-card.png" />
    <title>%GAME_NAME%</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
