name: Accessibility Tests

on:
  push:
    branches: [ master, dev ]
  pull_request:
    branches: [ master, dev ]

jobs:
  a11y-tests:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
        cache: 'npm'

    - name: Install dependencies
      run: cd frontend && npm ci

    - name: Run accessibility tests
      run: cd frontend && npm run test:a11y

    - name: Build project
      run: cd frontend && npm run build

    - name: Start server for Lighthouse
      run: cd frontend && npm run preview -- --host 127.0.0.1 & npx wait-on http://127.0.0.1:5173/

    - name: Run Lighthouse CI
      run: cd frontend && npx lhci autorun --config=src/tests/a11y/lighthouse-ci-config.js
      env:
        LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}

    - name: Archive accessibility results
      uses: actions/upload-artifact@v3
      with:
        name: accessibility-reports
        path: |
          frontend/lighthouse-report
          frontend/coverage-a11y
